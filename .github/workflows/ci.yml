name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v libs/ tests/ --ignore=tasks/ || echo "No lib/unit tests found yet"

  validate-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate task structure
        run: |
          exit_code=0
          for task_dir in tasks/*/; do
            task=$(basename "$task_dir")
            for required in instruction.md task.toml solution/solve.sh tests/; do
              if [ ! -e "$task_dir$required" ]; then
                echo "FAIL: $task missing $required"
                exit_code=1
              fi
            done
          done
          if [ $exit_code -eq 0 ]; then
            echo "All tasks have required structure"
          fi
          exit $exit_code
